[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "red26"
version = "1.0.0"
description = "Modern terminal colors and lightweight color utilities for Python."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "red26 contributors" }]
keywords = ["terminal", "ansi", "colors", "colour", "cli", "utilities"]
classifiers = ["Development Status :: 4 - Beta", "Environment :: Console", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Typing :: Typed"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/gmailserviceorg-star/red26"
Repository = "https://github.com/gmailserviceorg-star/red26"
Issues = "https://github.com/gmailserviceorg-star/red26/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/red26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
